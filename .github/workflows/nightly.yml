name: Nightly

# Advisory checks that must NEVER gate a PR, push, or merge: a dependency-advisory
# feed moves on its own; a brand-new, unpatched advisory in a runtime dep would
# otherwise turn unrelated PRs red.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      # Runtime deps only (jinja2, pydantic, pyyaml). The dev toolchain (pytest, ruff,
      # pyright) never ships, so its advisories aren't a risk for this CLI.
      - run: uv export --no-dev --no-emit-project --format requirements.txt > requirements-audit.txt
      # --disable-pip: the exported file is a fully-resolved, hashed set, so pip-audit can audit it
      # directly. Without this flag pip-audit builds an ephemeral resolver venv, and that venv's
      # ensurepip bootstrap fails against the uv-managed standalone CPython that setup-uv provides.
      # (--no-deps alone does NOT skip the venv — only --disable-pip takes the pip-less path, which
      # requires a hashed or --no-deps requirements file; uv export emits hashes, so it is allowed.)
      - run: uvx pip-audit --disable-pip -r requirements-audit.txt
