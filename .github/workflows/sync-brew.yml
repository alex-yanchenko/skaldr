name: Sync Homebrew formula

# Manually re-push skaldr's Homebrew formula to the tap for a given (default: latest)
# release — the recovery path when the release job's brew push didn't run or needs redoing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "skaldr version to pin (blank = latest release)"
        required: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            skaldr
            homebrew-tap
      - uses: astral-sh/setup-uv@v7
      - timeout-minutes: 40
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ver="$INPUT_VERSION"
          if [ -z "$ver" ]; then
            ver=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
            ver="${ver#v}"
          fi
          bash .github/scripts/sync-tap-formula.sh "$ver"
